name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package gamemode
        run: |
          mkdir -p release
          cp -r gamemodes/ release/
          cd release
          zip -r ../gangwarsrp-${{ github.ref_name }}.zip gamemodes/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: gangwarsrp-${{ github.ref_name }}.zip
          generate_release_notes: true
